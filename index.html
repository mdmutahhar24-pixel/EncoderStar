<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EncodeStar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">EncodeStar</div>
      <nav>
        <a href="#home">Home</a>
        <a href="#ascii">ASCII</a>
        <a href="#ciphers">Ciphers</a>
      </nav>
    </header>

    <main>
      <section id="home" class="panel hero">
        <div>
          <p class="eyebrow">Cipher & encoding toolkit</p>
          <h1>EncodeStar</h1>
          <p>
            Explore ASCII encoding, Caesar cipher, Atbash cipher, and substitution ciphers
            in a static app that works on GitHub Pages.
          </p>
        </div>
      </section>

      <section id="ascii" class="panel">
        <h2>ASCII</h2>
        <div class="grid two-col">
          <div class="card">
            <h3>Encode to ASCII</h3>
            <textarea id="ascii-input" placeholder="Enter text to encode"></textarea>
            <button class="primary" data-action="ascii-encode">Encode</button>
            <textarea id="ascii-output" readonly placeholder="ASCII output"></textarea>
            <button class="secondary copy" data-copy-target="ascii-output">Copy</button>
          </div>

          <div class="card">
            <h3>Decode ASCII</h3>
            <textarea id="ascii-decode-input" placeholder="Enter ASCII numbers"></textarea>
            <button class="primary" data-action="ascii-decode">Decode</button>
            <textarea id="ascii-decode-output" readonly placeholder="Decoded text"></textarea>
            <button class="secondary copy" data-copy-target="ascii-decode-output">Copy</button>
          </div>
        </div>
      </section>

      <section id="ciphers" class="panel">
        <h2>Ciphers</h2>

        <div class="grid three-col">
          <div class="card">
            <h3>Caesar Cipher</h3>
            <label>Shift</label>
            <input id="caesar-shift" type="number" min="0" max="25" value="3" />
            <textarea id="caesar-input" placeholder="Enter text"></textarea>
            <div class="button-row">
              <button class="primary" data-action="caesar-encode">Encode</button>
              <button class="secondary" data-action="caesar-decode">Decode</button>
            </div>
            <textarea id="caesar-output" readonly placeholder="Caesar result"></textarea>
            <button class="secondary copy" data-copy-target="caesar-output">Copy</button>
          </div>

          <div class="card">
            <h3>Substitution Cipher</h3>
            <label>Key</label>
            <input id="sub-key" type="text" value="" placeholder="26-letter key" />
            <button class="secondary" id="generate-key">Generate Key</button>
            <textarea id="sub-input" placeholder="Enter text"></textarea>
            <div class="button-row">
              <button class="primary" data-action="sub-encode">Encode</button>
              <button class="secondary" data-action="sub-decode">Decode</button>
            </div>
            <textarea id="sub-output" readonly placeholder="Substitution result"></textarea>
            <button class="secondary copy" data-copy-target="sub-output">Copy</button>
          </div>

          <div class="card">
            <h3>Atbash Cipher</h3>
            <label>Shift</label>
            <input id="atbash-shift" type="number" min="0" max="25" value="3" />
            <textarea id="atbash-input" placeholder="Enter text"></textarea>
            <div class="button-row">
              <button class="primary" data-action="atbash-encode">Encode</button>
              <button class="secondary" data-action="atbash-decode">Decode</button>
            </div>
            <textarea id="atbash-output" readonly placeholder="Atbash result"></textarea>
            <button class="secondary copy" data-copy-target="atbash-output">Copy</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
